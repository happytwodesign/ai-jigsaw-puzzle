<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f2b"/>
      <stop offset="0.7" stop-color="#232a5c"/>
      <stop offset="1" stop-color="#3c3a72"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131743"/>
      <stop offset="1" stop-color="#060818"/>
    </linearGradient>
    <pattern id="winA" width="28" height="36" patternUnits="userSpaceOnUse">
      <rect width="28" height="36" fill="#141a3d"/>
      <rect x="6" y="8" width="12" height="16" fill="#ffd97a"/>
    </pattern>
    <pattern id="winB" width="26" height="32" patternUnits="userSpaceOnUse">
      <rect width="26" height="32" fill="#101433"/>
      <rect x="5" y="6" width="11" height="14" fill="#8ad9ff"/>
    </pattern>
    <pattern id="winC" width="30" height="38" patternUnits="userSpaceOnUse">
      <rect width="30" height="38" fill="#171d47"/>
      <rect x="7" y="9" width="12" height="16" fill="#ffb26b"/>
    </pattern>
  </defs>
  <rect width="800" height="1200" fill="url(#nsky)"/>
  <!-- stars + moon -->
  <g fill="#dfe8ff">
    <circle cx="90" cy="90" r="2"/><circle cx="210" cy="60" r="1.5"/><circle cx="330" cy="110" r="2.2"/>
    <circle cx="470" cy="70" r="1.6"/><circle cx="590" cy="120" r="2"/><circle cx="700" cy="80" r="1.7"/>
    <circle cx="160" cy="180" r="1.4"/><circle cx="420" cy="180" r="1.8"/><circle cx="660" cy="200" r="1.5"/>
  </g>
  <circle cx="620" cy="170" r="46" fill="#f0ead2"/>
  <circle cx="604" cy="158" r="9" fill="#d8d2ba"/>
  <!-- skyline -->
  <rect x="20" y="420" width="110" height="480" fill="url(#winA)"/>
  <rect x="20" y="404" width="110" height="16" fill="#1c2450"/>
  <rect x="150" y="330" width="90" height="570" fill="url(#winB)"/>
  <path d="M 150 330 L 195 290 L 240 330 Z" fill="#1c2450"/>
  <rect x="260" y="480" width="120" height="420" fill="url(#winC)"/>
  <rect x="300" y="440" width="40" height="40" fill="#1c2450"/>
  <rect x="400" y="360" width="100" height="540" fill="url(#winA)"/>
  <rect x="438" y="300" width="8" height="60" fill="#2b345f"/>
  <circle cx="442" cy="296" r="6" fill="#ff5d5d"/>
  <rect x="520" y="440" width="90" height="460" fill="url(#winB)"/>
  <rect x="630" y="380" width="140" height="520" fill="url(#winC)"/>
  <path d="M 630 380 L 700 340 L 770 380 Z" fill="#1c2450"/>
  <circle cx="700" cy="336" r="6" fill="#ff5d5d"/>
  <!-- big lit billboard for a unique anchor -->
  <rect x="288" y="560" width="64" height="46" rx="6" fill="#ff77a9"/>
  <rect x="296" y="568" width="48" height="30" rx="4" fill="#ffd0e2"/>
  <!-- water -->
  <rect y="900" width="800" height="300" fill="url(#water)"/>
  <g stroke-width="5" fill="none" opacity="0.65" stroke-linecap="round">
    <path d="M 40 950 h 90" stroke="#ffd97a"/><path d="M 60 990 h 60" stroke="#ffd97a" opacity="0.5"/>
    <path d="M 180 970 h 70" stroke="#8ad9ff"/><path d="M 200 1015 h 46" stroke="#8ad9ff" opacity="0.5"/>
    <path d="M 300 960 h 80" stroke="#ffb26b"/><path d="M 316 1005 h 56" stroke="#ffb26b" opacity="0.5"/>
    <path d="M 440 980 h 76" stroke="#ffd97a"/><path d="M 460 1030 h 50" stroke="#ffd97a" opacity="0.5"/>
    <path d="M 560 955 h 66" stroke="#8ad9ff"/><path d="M 576 1000 h 44" stroke="#8ad9ff" opacity="0.5"/>
    <path d="M 660 985 h 84" stroke="#ffb26b"/><path d="M 680 1035 h 56" stroke="#ffb26b" opacity="0.5"/>
    <path d="M 320 1090 h 70" stroke="#ff77a9"/><path d="M 340 1130 h 44" stroke="#ff77a9" opacity="0.5"/>
  </g>
  <!-- small boat -->
  <g>
    <path d="M 90 1100 L 170 1100 L 152 1128 L 108 1128 Z" fill="#0d1230"/>
    <rect x="126" y="1064" width="6" height="36" fill="#0d1230"/>
    <circle cx="129" cy="1060" r="5" fill="#ffd97a"/>
  </g>
</svg>
